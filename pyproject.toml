[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-pulse-review"
version = "0.1.0"
description = "Groww App weekly pulse review agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "langdetect>=1.0.9",
    "google-play-scraper>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
